[project]
name = "polarscope"
dynamic = ["version"]
description = "🔬 Simple data inspection tools for Polars - basic X-ray analysis and utilities for DataFrames."
authors = [{ name = "Anders & Co." }]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "polars>=0.20",
  "matplotlib>=3.7",
  "great_tables>=0.10"
]
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
plotly = ["plotly>=5.20", "kaleido>=0.2"]
altair = ["altair>=5"]
scipy = ["scipy>=1.10"]
all = ["plotly>=5.20", "kaleido>=0.2", "altair>=5", "scipy>=1.10"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Single source of truth for the version: polarscope/__init__.py (__version__).
# setuptools reads it statically at build time.
[tool.setuptools.dynamic]
version = { attr = "polarscope.__version__" }

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
polarscope = ["data/*.parquet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
