[project]
name = "polarscope"
dynamic = ["version"]
description = "🔬 Simple data inspection tools for Polars - basic X-ray analysis and utilities for DataFrames."
authors = [{ name = "Anders & Co." }]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "polars>=1.0.0",
  "plotly>=5.20",
  "great_tables>=0.10"
]
readme = "README.md"
license = "MIT"

[project.urls]
Homepage = "https://github.com/pytoned/polarscope"
Repository = "https://github.com/pytoned/polarscope"
Issues = "https://github.com/pytoned/polarscope/issues"

[project.optional-dependencies]
plotly = ["kaleido>=0.2"]
altair = ["altair>=5"]
scipy = ["scipy>=1.10"]
all = ["kaleido>=0.2", "altair>=5", "scipy>=1.10"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "psutil>=5.9"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# Single source of truth for the version: polarscope/__init__.py (__version__).
# setuptools reads it statically at build time.
[tool.setuptools.dynamic]
version = { attr = "polarscope.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["polarscope*"]

[tool.setuptools.package-data]
polarscope = ["data/*.parquet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
