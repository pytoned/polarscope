<text x="114" y="102" font-family="JetBrains Mono" font-size="12.5" font-weight="700" fill="#d6336c" letter-spacing="3.2">POLARS-NATIVE · NO PANDAS</text>
<text x="76" y="196" font-family="Space Grotesk" font-size="76" font-weight="700" letter-spacing="-2.2" fill="#1f2230">Polar<tspan fill="#d6336c">scope</tspan></text>
<text x="78" y="242" font-family="Space Grotesk" font-size="20.5" font-weight="500" fill="#3a3f52">Inspect, clean and visualize Polars DataFrames</text>
<text x="78" y="270" font-family="Space Grotesk" font-size="20.5" font-weight="300" fill="#6b7180">— one import, Great Tables output, no Pandas.</text>
<rect x="76" y="308" width="322" height="54" rx="12" fill="#ffffff" stroke="#fcc2d7" stroke-width="1.5"/>
<text x="96" y="342" font-family="JetBrains Mono" font-size="17" fill="#f06595">$</text>
<text x="116" y="342" font-family="JetBrains Mono" font-size="17" font-weight="500" fill="#1f2230">pip install polarscope</text>
<text x="78" y="396" font-family="JetBrains Mono" font-size="12.5" fill="#6b7180" letter-spacing="0.3">Built-in datasets · titanic · diabetes · cardio</text>
<rect x="0" y="452" width="1280" height="188" fill="#ffffff"/>
<path d="M0 452.5 H1280" stroke="#efe3ea" stroke-width="1.5"/>
<path d="M76 486 H106" stroke="#f06595" stroke-width="2.5"/>
<text x="118" y="491" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#d6336c" letter-spacing="2.4">INSPECT</text>
<text x="76" y="526" font-family="JetBrains Mono" font-size="17.5" font-weight="700" fill="#1f2230">ps.xray(df)</text>
<text x="76" y="556" font-family="Space Grotesk" font-size="14.5" font-weight="300" fill="#6b7180">Summary stats for every dtype, distribution</text>
<text x="76" y="578" font-family="Space Grotesk" font-size="14.5" font-weight="300" fill="#6b7180">nanoplots, outliers, normality tests and</text>
<text x="76" y="600" font-family="Space Grotesk" font-size="14.5" font-weight="300" fill="#6b7180">correlations — Great Tables or Polars output.</text>
<path d="M460 486 H490" stroke="#f06595" stroke-width="2.5"/>
<text x="502" y="491" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#d6336c" letter-spacing="2.4">CLEAN</text>
<text x="460" y="526" font-family="JetBrains Mono" font-size="17.5" font-weight="700" fill="#1f2230">ps.fix(df)</text>
<text x="460" y="556" font-family="Space Grotesk" font-size="14.5" font-weight="300" fill="#6b7180">Rename to snake_case, strip whitespace, shrink</text>
<text x="460" y="578" font-family="Space Grotesk" font-size="14.5" font-weight="300" fill="#6b7180">dtypes and drop empty columns in one call —</text>
<text x="460" y="600" font-family="Space Grotesk" font-size="14.5" font-weight="300" fill="#6b7180">with a report of everything that changed.</text>
<path d="M844 486 H874" stroke="#f06595" stroke-width="2.5"/>
<text x="886" y="491" font-family="JetBrains Mono" font-size="11" font-weight="700" fill="#d6336c" letter-spacing="2.4">VISUALIZE</text>
<text x="844" y="526" font-family="JetBrains Mono" font-size="17.5" font-weight="700" fill="#1f2230">ps.dist_plot(df)</text>
<text x="844" y="556" font-family="Space Grotesk" font-size="14.5" font-weight="300" fill="#6b7180">Plus corr_heatmap, corr_plot, cat_plot and</text>
<text x="844" y="578" font-family="Space Grotesk" font-size="14.5" font-weight="300" fill="#6b7180">missingval_plot — Plotly or Altair backends,</text>
<text x="844" y="600" font-family="Space Grotesk" font-size="14.5" font-weight="300" fill="#6b7180">exported with save_fig.</text>

<rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#fcc2d7" stroke-width="1"/>
